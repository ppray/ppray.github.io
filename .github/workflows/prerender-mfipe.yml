# 复习笔记预渲染：正文写在页面的 <script id="md-source"> 里，靠浏览器端 marked 渲染，
# 不执行 JS 的抓取器（Baidu、GPTBot、ClaudeBot、PerplexityBot…）看不到任何内容。
# 构建期把它渲染成静态 HTML 写回 #content，并同步伴生 .md 与 sitemap。
#
# 路径：.github/workflows/prerender-mfipe.yml
# 手动触发：仓库 Actions 页面 → prerender-mfipe → Run workflow
#
# 页面自带指纹校验：预渲染副本与 md-source 对不上时会自动回退到浏览器实时渲染，
# 所以即便这个工作流失败，读者看到的内容也不会是旧的——只是爬虫会短暂看到旧正文。

name: prerender-mfipe

on:
  push:
    branches: [main]
    paths:
      - "国关复习/翟东升《货币与金融的国际政治经济学》复习笔记.html"
      - "scripts/prerender-mfipe.mjs"
      - "scripts/gen-sitemap.mjs"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prerender-mfipe
  cancel-in-progress: false

jobs:
  prerender:
    # 跳过本工作流自己推的那次提交，避免来回触发
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 两个脚本都用 git log 取「最后修改日期」（sitemap 的 lastmod、JSON-LD 的 dateModified）。
          # 默认的浅克隆里 git log 对绝大多数文件返回空，会退化成 checkout 时间，
          # 导致每次运行都把全站 lastmod 刷成当天——这种撒谎的 lastmod 会被搜索引擎降权。
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 重新预渲染并同步 sitemap
        run: |
          node scripts/prerender-mfipe.mjs
          node scripts/gen-sitemap.mjs

      - name: 提交变更
        run: |
          if git diff --quiet; then
            echo "预渲染副本已是最新，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(seo): 重新预渲染复习笔记正文并同步 sitemap"
          git push
