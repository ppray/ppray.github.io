##### **📚 深度复习笔记（逻辑推导、视图与理论延伸）**

**（一）反驳“中国搭便车者”论**

美国指责中国是现行国际秩序的“搭便车者”，这一观点是片面且不公正的，忽视了中国作为全球经济增长引擎和公共产品提供者的核心作用。

1.  **中国是全球经济增长的主要贡献者**：中国对世界经济增长的平均贡献率超过30%，是名副其实的“稳定器”和“动力源”。中国的工业化进程为全球提供了物美价廉的商品，有效抑制了全球通胀，提高了各国消费者的实际购买力。所谓“搭便车”，实则是中国为全球公共产品（稳定的市场、廉价的商品）支付了巨额“车费”。
2.  **中国是现行国际体系的积极参与者和建设者**：中国是联合国第二大会费国和维和摊款国，积极参与反海盗、气候变化等全球治理行动。中国提出的“一带一路”倡议为沿线国家提供了基础设施建设等发展性公共产品，是补充而非破坏现有体系。
3.  **中国为美国霸权提供了关键支撑**：在过去的“中美国”(Chimerica)共生关系中，中国通过购买美国国债、为美国消费者提供廉价商品、承接产业转移，实际上为美国的美元霸权、低通胀和过度消费模式提供了巨大支持。美国享受了“美元是我们的货币，却是你们的问题”这一特权，其国内失衡的代价部分由中国等顺差国承担。从这个角度看，美国才是长期“搭便车”的一方。
4.  **“搭便车”论本质是霸权护持的话术**：当中国从追随者变为竞争者，美国便将中国合理的发展诉求污名化为“修正主义”和“搭便车”，其目的是维护自身垄断性收益，将中国锁定在产业链低端，为遏制战略制造舆论。

**（二）中国加入美国主导全球化的收益与代价**

中国融入美国主导的全球化进程，是一个充满战略机遇与深刻代价的辩证过程。

**收益方面：**
1.  **实现了史无前例的工业化与经济崛起**：通过承接全球产业转移、融入国际大循环，中国完成了人类历史上最大规模的工业化，成为世界第二大经济体和制造业第一大国。这得益于“吸星大法”式的政策组合（鼓励出口、吸引外资、积累外汇），成功将外部资源转化为自身发展动能。
2.  **获得了技术、管理经验与现代市场观念**：外资引入不仅带来了资本，更带来了技术、管理经验和市场竞争机制，加速了中国企业的学习曲线和现代化进程。
3.  **深度融入全球价值链，提升了国际地位**：中国从全球化的边缘参与者成长为东亚生产网络的核心枢纽，在全球经济治理中的话语权显著提升。

**代价方面：**
1.  **承受了巨大的资源环境代价与劳工权益牺牲**：出口导向型发展模式曾长期依赖高能耗、高污染和廉价劳动力，导致环境污染严重、资源过度开采，并伴随着对劳工权益一定程度的压抑。这相当于“拿自己的子孙后代换取美元”。
2.  **陷入了“贫困化增长”与外部依赖困境**：长期处于全球价值链中低端，付出大量劳动和资源，但获得的附加值相对较低。同时，在核心技术、关键零部件、能源资源等领域存在对外依赖，易受“卡脖子”风险。
3.  **面临严重的贫富分化与内需不足问题**：全球化收益在地区和阶层间分配不均，加剧了国内贫富差距。同时，高投资、高出口的发展模式导致国民收入分配向企业和政府倾斜，居民消费率偏低，内需驱动增长的模式转型艰难。
4.  **承担了美元霸权下的金融风险**：巨额外汇储备主要投资于美国国债，面临美元贬值和资产缩水的风险，为美元信用提供了隐性担保。

**结论**：中国并非“搭便车者”，而是全球化进程中贡献巨大但收益与代价不对称的关键参与者。中国加入全球化的根本收益在于实现了国家实力的历史性跨越，其代价则揭示了旧有全球化模式的不平等性和不可持续性。当前，中国推动构建“双循环”新发展格局、倡导“一带一路”高质量发展，正是为了超越旧模式，探索更加公平、可持续的全球化新路径。

#### **7. [论] 从20世纪70年代开始，阿根廷、智利、乌拉圭等发展中国家实施了一系列金融自由化改革，从政治经济学角度论述其经验教训和对我国未来金融改革的启示。**

> 📚 **引用来源**：《制裁与经济战》（美元武器化、金融制裁与去美元化）；《货币、权力与人》第5章（全球化与逆全球化的政治经济学）

> *出现 1 次：卷1* 


##### **🎯 考场标准作答（直击采分点 · 可直接背诵）**

> **答：70 年代起拉美金融自由化（智利、阿根廷、乌拉圭）以"芝加哥男孩"主导的急速自由化、货币局制度等模式失败告终；四条政治经济学教训——金融自由化不能脱离实体经济、资本账户开放过急致热钱泡沫、汇率制度选择至关重要、IMF"条件性贷款"是为下一轮收割拆除防火墙；对中国启示是"渐进 + 有管理 + 守住制造业基本盘"三原则。**
>
> **一、改革背景与三大失败模式**
> * **背景**：70 年代布雷顿森林崩溃后，拉美在军政府或技术官僚推动下快速推行金融自由化（放开利率、开放资本账户、银行私有化）。
> **1. 智利（1975–1982）**："芝加哥男孩"（芝加哥学派培养的智利经济学家）主导急速自由化 → 高利率 + 汇率高估 → 银行危机 + 债务危机，1982 崩溃，国家接管全部银行。
> **2. 阿根廷（80-90 年代反复）**："比索-美元等价制"（货币局制度）→ 货币危机 → 2001 年有史以来最大主权违约。
> **3. 乌拉圭**：受阿根廷传染，2002 年银行挤兑危机。
>
> **二、四条政治经济学教训**
> **4.** 金融自由化不能脱离实体经济支撑，没有强大制造业的金融开放等于门户洞开。
> **5.** 资本账户开放过急 → 热钱流入制造泡沫 → 外部冲击时资本外逃引爆危机。
> **6.** 汇率制度选择至关重要——盯住美元 + 过度举债 + 竞争力下降 = 死亡组合。
> **7.** IMF 的"条件性贷款"（紧缩 + 私有化 + 进一步开放）不是救助，而是为下一轮收割拆除防火墙。
>
> **三、对中国未来金融改革的启示**
> **8.** 中国的成功在于拒绝照搬华盛顿共识——资本账户审慎开放、维持强大制造业、国家掌握金融资源配置权。
> **9.** 未来金融改革须坚持"**渐进 + 有管理 + 守住制造业基本盘**"三原则。
> * **翟东升视角**：拉美金融自由化是"**美元潮汐收割**"的经典实验室——美元宽松时资本涌入制造繁荣，美元收紧时资本抽离引爆危机，周而复始；中国应引以为戒，金融开放必须以我为主、循序渐进。
>
> **一句话口诀**：**失败"智利芝加哥·阿根廷货币局·乌拉圭传染"，教训"实体·资本·汇率·IMF"，启示"渐进·有管理·守制造业"**。


##### **📚 深度复习笔记（逻辑推导、视图与理论延伸）**

**为什么这题要分「失败模式 → 教训 → 启示」三层来答？**
题目本身问的是"经验教训 + 启示"，逻辑链是**现象（三国崩）→ 共性根因 → 反推中国该怎么做**。这三层不是并列罗列，而是层层上抽：先看三个国家各是怎么死的（智利急速自由化、阿根廷货币局、乌拉圭被传染），再提炼它们共同的死因（脱离实体、开放过急、汇率死组合、IMF补刀），最后把这些死因**取反**就是中国该守的原则。理解了这个"现象→根因→反推"的递进，就不必死记四条教训——它们都是从失败反推出来的。

<span class="hl-q">**📌 翟东升的撕开点（这才是分析分的来源，别处听不到）**</span>

主流教材讲拉美危机只讲"借太多、管不住"，翟东升的独特之处是把这套失败放进**"美元潮汐收割实验室"**的框架里看：

*   **别处的解释是静态的**（拉美自己作死）→ **翟的解释是动态的、有主谋的**：美元宽松时资本涌入拉美制造繁荣假象（吹泡），美元收紧时资本抽离引爆危机（收割）。拉美不是孤立的"自己作死"，而是被嵌入了一个**周期性收割的结构**里。
*   **最反常识的一刀**：IMF 的"条件性贷款"（紧缩 + 私有化 + 进一步开放）看似是救助，实则是**为下一轮收割拆除防火墙**——逼你开放、逼你放弃管制，下一轮美元潮汐来时你就更没有抵挡能力。这一论断是翟东升最具辨识度的判断，**论述时甩出来就是分析分**。

**🔗 与其他题的联动（背一个机制通吃三题 · [⬆️ 回总方法论](#一机制通吃三题)）**

*   本题（拉美金融自由化）+ **国际货币体系 Q5**（牙买加周期危机的"美元潮汐四步收割"）+ **金融危机史 Q6**（80年代拉美债务）——**三题是同一套"美元潮汐"机制的不同切面**：
    *   Q5 讲**机制本身**（放水→吹泡→收水→收割）；
    *   金融危机史 Q6 讲**80年代拉美怎么被这套机制收割**（沃尔克加息是导火索）；
    *   本题讲**拉美主动搞金融自由化 = 主动把自己送进收割机**。
*   背熟"美元潮汐"一个机制，三题的分析框架就都有了。区别只在切入点：Q5 从体系讲，债务 Q6 从危机讲，本题从改革选择讲。

**⚠️ 易混辨析：智利 vs 阿根廷，别混为一谈**

| | 智利（1975-1982） | 阿根廷（80-90年代反复） |
|---|---|---|
| **主导力量** | "芝加哥男孩"（芝加哥学派技术官僚） | 军政府/民选政府反复 |
| **失败机制** | **急速自由化**（学派主导，一夜放开） | **货币局制度**（比索硬盯美元） |
| **崩盘方式** | 高利率+汇率高估→银行+债务危机 | 丧失贬值调节→2001最大主权违约 |
| **教训侧重** | 金融自由化**不能脱离实体** | **汇率制度选择**是死亡组合 |

两人都死了，但死法不同——智利死于"开放过急"，阿根廷死于"汇率僵化"。答题时**切忌把三国混成一个故事讲**，要分别点出各自的死因。

**🎯 考场陷阱提醒**：题干问"对我国未来金融改革的启示"，**不要只复述中国现状**（中国怎么成功的），要明确落点到"未来怎么改"——即"渐进 + 有管理 + 守住制造业基本盘"三原则，且要点出这是**对拉美教训的反向操作**（拉美急进→中国渐进；拉美放弃管制→中国有管理；拉美去工业化→中国守制造业）。

#### **1. [名] 最优货币区 / 产业链编辑能力 (CICE) / 全球供应链。**

> *组内三词各出现 1 次：最优货币区→卷5 · 产业链编辑能力(CICE)→卷7 · 全球供应链→卷3*（词条详解与补遗章重叠）

##### **最优货币区 (Optimal Currency Areas, OCA)**
最优货币区理论是国际经济学中的一个重要概念，指<span class="hl">符合特定条件的国家或地区组成的货币联盟</span>。在此区域内，成员国之间实行固定汇率或统一货币，对外则保持浮动汇率，以实现资源的高效配置。

该理论由**罗伯特·蒙代尔**于1961年首次提出。蒙代尔认为，<span class="hl">**生产要素（尤其是劳动力）的流动性**是界定最优货币区的关键标准</span>。当区域内成员国间要素完全流动时，可以通过劳动力迁移等调节机制应对非对称冲击，从而替代汇率调整，使固定汇率体系得以稳定运行。

此后，多位经济学家对理论进行了补充和完善：
*   **麦金农**提出了**经济开放度**标准，认为经济高度开放的小国更适合组成货币区。
*   **凯南**提出**产品多样化**标准，认为产品多样化程度高的国家更能抵御外部冲击。
*   **英格拉姆**强调了**金融市场一体化**的重要性。
*   **哈伯勒与弗莱明**则指出了**通货膨胀率相似性**的重要性。

欧元区的建立是该理论最重要的实践。它降低了交易成本，促进了要素流通，但也暴露出非对称经济结构下的治理难题（如主权债务危机）。

##### **产业链编辑能力 (Capacity of Industrial Chain Editing, CICE)**
这是一个在国际政治经济学领域提出的新概念。它指<span class="hl">大国依靠自身庞大的**市场规模**以及对某些**关键性生产要素的掌控**而获得的一种特殊能力</span>。

藉此能力，大国可以在一定程度上按照自身国家利益的需要，<span class="hl">**主动调整地区性甚至全球性的产业地理分布**</span>。这种调整旨在从国家间不对称的相互依赖中获得优势和权力，是理解大国经济竞争与产业政策的一个新视角。

> 💡 **通俗理解**：把全球产业链想成一部电影——普通国家是"群众演员"（剧本是跨国公司写好的，只能演分给自己的角色，即"嵌入"）；有 CICE 的大国是"总导演＋编剧"，靠自己巨大的市场和对关键资源的掌控，**自己定剧本**：主角环节留国内、次要环节派国外、必要时删掉某个角色（切断供应）。"编辑"＝对产业链做**增**（培育高端环节）、**删**（转出低端环节）、**切**（掐断关键环节反制他国）三个动作。翟东升：掌握 CICE 是中国从"世界工厂"升级为"世界产业链编辑者"的关键。

##### **全球供应链**
全球供应链指在全球范围内，<span class="hl">为实现商品和服务价值，连接生产、销售、回收处理等过程的跨国性企业网络组织</span>。它是产业分工深化的结果，本质是不同产业企业之间基于技术经济关联形成的链式关联关系。

全球供应链具有**结构属性**和**价值属性**两维属性。结构上表现为大量上下游关系，价值上表现为各环节间的价值交换。其核心是产业关联，实质是各产业中企业之间的供给与需求关系。在全球价值链中，**设计研发、核心部件制造（微笑曲线左端）和品牌销售、售后服务（微笑曲线右端）** 通常占据高附加值环节，而中间的制造组装环节附加值相对较低。

#### **2. [简] 印度为何参与RCEP长期谈判但最后退出？**
> *出现 1 次：卷5*


##### **🎯 考场标准作答（直击采分点 · 可直接背诵）**

> **答：印度退出 RCEP 是经济、地缘、政治、条款四重因素叠加的结果，核心是对国内产业竞争力不足的深切担忧。**
>
> **1. 经济冲击担忧（根本原因）**：制造业薄弱、产品无国际竞争力，与 RCEP 多数成员长期逆差，担忧关税降低后中国等国商品涌入冲击脆弱的制造业和农业（农业难与澳新规模化竞争），引发企业倒闭与失业。
> **2. 贸易逆差与产业空心化恐惧**：长期对华逆差显著，加入 RCEP 会进一步扩大逆差、加剧空心化，威胁"印度制造"计划。
> **3. 地缘政治与战略考量**：戒心中国主导区域经济，认为 RCEP 会加强中国在亚太的存在，与印度追求战略自主、区域主导权的意图不符。
> **4. 国内政治压力**：农民团体、中小企业、右翼民族主义势力强烈反对，莫迪政府为巩固执政基础选择退出。
> **5. 协定条款不满**：RCEP 在关税减让、原产地规则、服务贸易开放上未照顾印度"特殊性"，未满足其"不对称开放"诉求。

**三、对比视角：印度 vs 中国的开放逻辑差异**

翟东升的政治经济学视角提示：开放与否取决于**产业竞争力 + 国家战略阶段**。中国 2001 年入世时制造业已有基础、能"以市场换技术"承受冲击；印度制造业薄弱、惧怕被中国商品淹没，故选择保护。这印证了"**没有产业竞争力的开放=门户洞开**"（参见拉美金融自由化教训）。

> 💡 **记忆口诀**：五原因 = **"经弱（怕冲）+ 逆差（怕空）+ 地缘（怕华）+ 政治（怕丢票）+ 条款（怕不对等）"**；本质 = **产业无竞争力的自我保护 + 大国身份焦虑**。

#### **3. [论] 从债务经济学角度论述“一带一路”对中国储蓄的转变与后果**
> *出现 1 次：卷8* 


##### **🎯 考场标准作答（直击采分点 · 可直接背诵）**

> **答："一带一路"使中国储蓄从"被动积累（买发达国家低收益国债）"转向"主动输出（对发展中国家生产性领域直接投资与信贷）"；这一转变带来"提升收益 + 塑造新型相互依赖 + 推人民币国际化"的积极后果，也伴随"债务可持续性 + 地缘政治金融 + 全球储蓄格局转变 + 转型压力"的风险挑战。**
>
> **一、转变：从"被动积累"到"主动输出"**
> **1. 转变前（储蓄过剩与低效配置）**：中国长期高储蓄率（2022 储蓄/GDP 约 45%），大量贸易顺差转化为外储主要投美债等"安全资产"，收益率极低（曾现负利率）——本质是"资金回流"模式：把贸易顺差形成的储蓄借给发达国家消费投资，换低收益债权资产。
> **2. "一带一路"带来的转变（多元化 + 实体化）**：
> * **资产配置多元化**：部分原本投发达国家金融市场的储蓄，以贷款、股权投资形式投向沿线国基础设施、能源、制造业等实体经济，据资产组合理论提升整体收益率并分散风险。
> * **融资模式实体化**：国内储蓄通过国开行、进出口银行等以人民币债券融资等方式，直接服务海外实体项目建设，使储蓄更直接转化为全球南方"造血"能力（如基础设施），而非单纯金融资产积累。
>
> **二、积极后果（三）**
> **3. 提升储备资产收益率**：储蓄投向回报率更高的新兴市场资产，改善对外资产负债表结构与收益。
> **4. 促进人民币国际化**：通过"熊猫债"等金融工具支持"一带一路"项目融资，扩大人民币在国际资本流动中的使用。
> **5. 塑造不对称相互依赖与权力**：通过"产业链编辑能力"将相关国家更深纳入以中国为中心的供应链网络，形成结构性权力——超越简单债务关系，是更深层次经济捆绑。
>
> **三、潜在风险与挑战（四）**
> **6. 债务可持续性风险**：部分沿线国合作前已债务沉重，项目若现金流不足可能违约；虽研究显示其债务多源于历史积累而非中方借贷，但项目失败仍会引发"债务陷阱"舆论指责。
> **7. 地缘政治与金融风险**：大规模对外投资面临东道国政治更迭、政策变动、安全局势等风险，可能致项目搁浅与资产损失；资本项目开放与汇率管理也面临新挑战。
> **8. 全球宏观环境转变的挑战**：全球正从"储蓄过剩"走向"结构性储蓄干涸"，储蓄率下降、利率上升，中国过去依赖的高储蓄低成本融资环境正变化，未来"一带一路"融资成本可能上升。
> **9. 转型压力**："一带一路"本身也在从"修路建港"转向"产业+供应链+能源系统"长期绑定，对项目管理、风险控制、软实力输出能力提出更高要求。
>
> <span class="hl">**结论**："一带一路"使中国储蓄从"为发达国家融资"的被动模式转向"为全球南方发展赋能"的主动模式；成功与否关键在能否有效管理债务可持续性、地缘政治风险，并适应全球储蓄-投资格局的深刻变化</span>。
>
> **一句话口诀**：**转变"被动积累→主动输出"（多元+实体），积极"收益·人民币·结构性权力"，风险"债务·地缘·储蓄格局·转型"**。


##### **📚 深度复习笔记（逻辑推导、视图与理论延伸）**

**这题的逻辑精髓：储蓄转型是"被动→主动"的范式转换，不是"换个投资对象"**

题目问"一带一路对中国储蓄的转变与后果"，关键不是罗列"变了什么"，而是抓住那个**范式级的转变**——中国储蓄从**"为发达国家被动融资"**转向**"为全球南方主动赋能"**：
*   **转变前（被动模式）**：贸易顺差→外储→买美债→借给发达国家消费（收益率 ~3%，甚至负利率）。本质是"**资金回流**"——穷国借钱给富国，是向美元体系交"货币地租"。
*   **转变后（主动模式）**：储蓄→国开行/进出口行→一带一路实体项目（基础设施/能源/制造业）。本质是"**造血输出**"——把储蓄转化为全球南方的生产能力，换取更高收益和战略网络。
*   **范式跃迁**：从"金融资产积累"（被动、低收益、依附美元）到"实体产能输出"（主动、高收益、塑造网络）。这才是"转变"的真正含义——不是换个投资标的，而是**从"被美元体系束缚"转向"自主塑造经济网络"**。

<span class="hl-q">**📌 翟东升视角的撕开点：从"债务关系"到"结构性权力"**</span>

主流讲"一带一路"要么讲成"援外"（ altruistic ），要么讲成"债务陷阱"（西方指控），翟东升的独特视角是把它定性为**塑造不对称相互依赖的结构性权力工具**：
*   通过"**产业链编辑能力**"（CICE），把沿线国家更深地纳入以中国为中心的供应链网络——这超越了简单的债权债务关系，是**更深层次的经济捆绑**。
*   一旦形成这种结构性依赖，中国获得的不仅是利息回报，更是**对相关国家经济走向的影响力**——这是"权力"而非"债权"。
*   **这一刀的意义**：它把"一带一路"从"花钱"重新定性为"**投资结构性权力**"——理解了这一点，才能解释为什么明知有债务风险中国还要做。

**🔗 与外汇储备题、外资 FDI 题的联动（储蓄循环的闭环）**

本题与 **外汇储备 Q2/Q4/Q7**、**外资 FDI Q5** 构成一组**"中国储蓄/资本的全球循环"**完整图景：
*   **外汇储备题**：讲中国储蓄**被动**流向美国（买美债，低收益）的旧模式及其代价（货币地租）；
*   **本题（一带一路）**：讲中国储蓄**主动**流向全球南方的新模式（实体投资，高收益+权力）；
*   **外资 FDI 题**：讲改革开放时外资**流入**中国（被动接收方），现在轮到中国资本**输出**（主动输出方）。
*   三组题串起中国从"储蓄被动输出→主动编辑全球网络"的战略升级——从美元体系的"附庸"成长为塑造新秩序的"主体"。

**⚠️ 易混辨析：积极后果 vs 潜在风险，要辩证看**

| | 积极后果 | 潜在风险 |
|---|---|---|
| **经济层** | 提升储备收益率 + 人民币国际化 | 债务可持续性（项目现金流不足） |
| **战略层** | 塑造不对称相互依赖（结构性权力） | 地缘政治风险（东道国政治更迭） |
| **环境层** | — | 全球从"储蓄过剩"转向"储蓄干涸"，融资成本上升 |

注意：风险不是"做错了"，而是"**转型中的内在张力**"——一带一路本身也在从"修路建港"转向"产业+供应链+能源系统"的长期绑定，这对项目管理、风险控制、软实力提出更高要求。辩证地看（机遇+挑战）才是本题的正确姿态。

**🎯 结论的落点逻辑：成功关键在"管理三件事"**

结论不是空泛的"机遇挑战并存"，而是点出三个**具体的管理着力点**：① 债务可持续性管理；② 地缘政治风险防控；③ 适应全球储蓄-投资格局变化（储蓄干涸时代融资成本上升）。未来方向是**融资方式更商业化、市场化**——这是应对债务风险的根本之策。

> 💡 **记忆锚点**：一个对比 + 一个数字——**被动买美债 ~3% vs 主动投实体更高收益**（范式转换的量化对比），**中国储蓄率 ~GDP 45%**（高储蓄是这套转型的物质基础）。一句话：**从"借钱给富国"到"赋能穷国"，从债权到权力**。

#### 1. [名] 最优货币区（Optimal Currency Area, OCA）
> *出现 1 次：卷5*


**一句话定义**：指在某一地理区域内，<span class="hl">采用单一货币或固定汇率比各自浮动汇率更有效率的经济区域</span>。

**记忆要点（"蒙代尔四条件 + 后续补充"）**：

| 提出者 | 核心标准 |
|--------|---------|
| 蒙代尔（1961） | **生产要素高度流动**（劳动力、资本可自由流动来替代汇率调整） |
| 麦金农 | **经济高度开放**（贸易占比越高，固定汇率收益越大） |
| 凯南 | **产品多样化**（产业结构越多元，越不需要汇率调整应对外部冲击） |
| 后续学者 | **通胀率趋同、财政政策协调、对称性经济冲击** |

**翟东升视角**：最优货币区理论本质上揭示了**货币主权让渡的条件**——欧元区是最典型的实践案例，但其内部各国经济结构差异大、财政不统一，说明"最优"条件在现实中难以完全满足。货币区的形成不仅是经济问题，更是**政治权力博弈**的结果。

> 💡 **速记口诀**：蒙（要素流动）麦（开放度）凯（多样化），通胀趋同加协调。

#### 2. [名] 经常项目与资本项目
> *出现 1 次：卷5*


**经常项目（Current Account）**：记录一国与外国之间的<span class="hl">**实际资源流动**</span>。

| 子项目 | 内容 |
|--------|------|
| 货物贸易 | 商品进出口（最大项） |
| 服务贸易 | 运输、旅游、金融服务等 |
| 初次收入 | 工资、投资收益（利息、股息） |
| 二次收入 | 单方面转移（侨汇、援助） |

**资本项目（Capital and Financial Account）**：记录一国与外国之间的<span class="hl">**资产所有权变动**</span>。

| 子项目 | 内容 |
|--------|------|
| 资本账户 | 资本转移、非生产性资产买卖 |
| 金融账户 | 直接投资（FDI）、证券投资、其他投资、储备资产 |

**核心关系**：经常账户 + 资本与金融账户（含储备资产）+ 误差遗漏 ≡ 0（国际收支恒等式，会计上恒等）。因此若把**储备资产也算进金融账户**，一国经常项目顺差必然对应"非储备金融账户逆差 + 储备资产增加"，两者合计与经常顺差相抵。

> ⚠️ **辨析"双顺差"**：所谓"双顺差"里的第二个"顺差"，指的是**剔除储备资产后的资本与金融账户**（即 FDI + 证券 + 其他投资）也为顺差。此时"经常顺差 + 非储备金融账户顺差"没有被私人资本流出抵消，只能由**央行购汇、外汇储备被动增加**来平衡——这正是外汇储备急剧膨胀的会计根源。换言之，"双顺差"不违反恒等式，恒等式的配平项就是那笔飙升的官方储备。

**翟东升视角**：中国长期"双顺差"格局（经常账户 + 非储备金融账户同时顺差、以官方储备暴增配平），本质上是**将实际资源换成外币资产**，承担了他国量化宽松的代价，体现了国际货币体系不对称的结构性剥削。

> 💡 **速记**：经常管"货物+服务+收入"，资本管"投资+资产"，二者互为镜像。

#### 3. [名] 国际收支（Balance of Payments, BOP）
> *出现 1 次：卷5*


**定义**：**国际收支平衡表（Balance of Payments, 简称 BOP）** 是一个国家在特定时期内（通常为一年或一个季度），将其<span class="hl">与世界其他国家和地区之间发生的所有经济交易进行系统记录的统计报表</span>。

简单来说，BOP 就像是一个国家的“年度对账单”，记录了钱是怎么流进来的（贷方），以及钱是怎么流出去的（借方）。

**三大组成**：
1. **经常账户**：贸易、服务、收入、转移
2. **资本与金融账户**：投资、资产买卖
3. **错误与遗漏**：统计误差的平衡项

**核心原理**：国际收支在会计上总是平衡的（贷方总额 = 借方总额），但**经济意义上**可能出现顺差或逆差。

**翟东升视角**：国际收支不仅是经济账本，更是**国际政治权力关系的映射**。美国长期经常项目逆差却安然无恙，正因为美元霸权使其可以用"印钞"来平衡，而发展中国家的逆差则往往引发货币危机，这体现了国际货币体系中的**结构性不平等**。

> 💡 **速记**：BOP = 经常 + 资本 + 误差遗漏 = 0（会计平衡），核心看经常项目差额。

#### 4. [名] 一价定律（Law of One Price）
> *出现 1 次：卷5*


**定义**：在没有交易成本和贸易壁垒的完全竞争市场中，<span class="hl">同质商品在不同地点以同一货币表示的价格应当相同</span>。

**公式**：P₁ = e × P₂（其中 e 为汇率）

**理论地位**：
- 是**购买力平价理论（PPP）** 的微观基础
- 巨无霸指数（Big Mac Index）是其典型应用
- 套利机制是使价格趋同的核心动力

**现实偏离原因**：
- 运输成本、关税等交易成本
- 非贸易品（如房租、理发）无法跨国套利
- 市场不完全竞争与信息不对称
- 汇率短期波动偏离基本面

**翟东升视角**：一价定律在**可贸易品**领域大致成立，但在服务业等非贸易品领域经常失效。这正是发展中国家货币的市场汇率往往低于 PPP 隐含币值（即市场汇率被低估）的原因——"巴拉萨-萨缪尔森效应"揭示了生产率差异导致的系统性价格偏差。

> 💡 **速记**：同物同价靠套利，现实因成本和壁垒而偏离，是PPP理论的基石。

#### 5. [名] 可贸易品（Tradable Goods）
> *出现 1 次：卷5*


**定义**：<span class="hl">可以在国际市场上进行交易的商品和服务，其价格受国际竞争和汇率变动的直接影响</span>。

**与不可贸易品的对比**：

| | 可贸易品 | 不可贸易品 |
|---|---------|-----------|
| 定义 | 可跨国交易 | 仅限本地消费 |
| 举例 | 制造业产品、矿产、农产品 | 房地产、理发、本地餐饮 |
| 价格决定 | 国际市场供需 | 本地市场供需 |
| 一价定律 | 大致适用 | 基本不适用 |
| 汇率影响 | 直接影响出口竞争力 | 间接影响 |

**翟东升视角**：中国崛起在全球范围内引发了一场**"价格革命"**——工业制成品、运力、电力、算力和火力（按演讲记录整理，'火力'疑为笔误，未核）五个领域的可贸易品价格大幅下降，这重塑了全球贸易格局和各国比较优势结构。可贸易品部门的强大是一国货币国际化的产业基础。（注："五领域价格革命"这一具体表述见于翟东升近年公开演讲，非《货币、权力与人》等著作原文；引用时宜注明出处。）

> 💡 **速记**：能出口就是可贸易品，价格由国际市场定；不能出口的叫不可贸易品，价格由本地定。

#### 6. [名] 购买力平价（PPP）
> *出现 1 次：卷9*


**一句话定义**：<span class="hl">汇率由两国货币购买力之比决定的理论</span>，即一国货币的价值取决于它能买到多少东西。

**两种形式**：
- **绝对PPP**：汇率 = 本国物价水平 / 外国物价水平（e = P/P*）
- **相对PPP**：汇率变动率 = 两国通胀率之差

**理论基础**：一价定律（同质商品跨国价格趋同）

**经典应用**：巨无霸指数（Big Mac Index）

**翟东升视角**：PPP在可贸易品领域大致成立，但服务业等非贸易品领域经常失效——这正是发展中国家货币往往被PPP"低估"的原因（巴拉萨-萨缪尔森效应）。翟东升认为，按 PPP 折算的人民币币值远高于按市场汇率折算的水平（人民币 PPP 隐含汇率约 4 CNY/USD，显著低于市场汇率约 7），说明**人民币市场汇率长期被低估**，中国人的实际购买力远高于美元汇率所显示的水平。

> 💡 **速记**：汇率 = 两国物价之比。巨无霸指数是PPP的通俗应用。翟东升：PPP证明人民币长期被低估。

---

#### 7. [名] 利率平价
> *出现 1 次：卷10*


**一句话定义**：在资本自由流动条件下，<span class="hl">两国利率差异应等于远期汇率升贴水率，以消除套利机会</span>。

**核心公式**：远期汇率/即期汇率 ≈ （1+本国利率）/（1+外国利率）

**通俗理解**：如果A国利率高于B国，那么A国货币的远期汇率应该贴水（预期贬值），使得两国投资的实际收益趋同。

**两种形式**：
- **抛补利率平价（CIP）**：通过远期外汇合约锁定汇率风险后的套利均衡
- **非抛补利率平价（UIP）**：预期汇率变动等于利率差异

**翟东升视角**：利率平价在成熟金融市场大致成立，但对发展中国家而言，资本管制和政治风险使之经常失效。**中国正是通过资本账户的审慎管控，保持了货币政策的独立性**，没有被迫跟随美联储的利率周期。

> 💡 **速记**：高利率国货币远期贴水。利率高→资本流入→即期升值，但远期预期贬值→均衡。

---

#### 8. [名] 国债收益率曲线
> *出现 1 次：卷10*


**一句话定义**：<span class="hl">反映不同期限国债到期收益率关系的曲线</span>，横轴为期限（1月、1年、5年、10年、30年），纵轴为收益率。

**三种形态及其经济含义**：

| 形态 | 含义 |
|------|------|
| **正常向上倾斜** | 长期利率 > 短期利率，经济预期正常，市场对未来通胀有温和预期 |
| **平坦化** | 长短期利率接近，经济前景不确定 |
| **倒挂（倒转）** | 短期利率 > 长期利率，**经济衰退的强信号**，市场预期央行未来将大幅降息 |

**翟东升视角**：美国国债收益率曲线是全球金融市场的**"温度计"**，因为美债是后布雷顿森林体系的"准锚"——美联储通过影响收益率曲线，不仅调控国内流动性，更对全球美元流动性和资产定价产生**溢出效应**。外围国家持有美债 = 将自身经济命运绑定于这条曲线。

> 💡 **速记**：正常=经济健康（上升斜坡），倒挂=衰退预警（下降斜坡）。翟东升：美债收益率曲线是全球金融温度计。

### <a id="补遗-发展与政治经济学概念"></a>发展与政治经济学概念

#### 1. [名] 去工业化
> *出现 1 次：卷8*


**一句话定义**：指<span class="hl">一国制造业在国民经济中的比重（产值占GDP比重和就业占比）持续下降的过程和趋势</span>。

**两种类型**：

| 类型 | 性质 | 典型案例 |
|------|------|---------|
| **成熟型去工业化** | 经济发展到高级阶段的自然演进，服务业替代制造业成为主导 | 德国、日本（制造业仍强，但占比下降） |
| **病理型去工业化** | 尚未充分工业化即出现、或由货币高估/政策扭曲等非自然因素驱动的制造业萎缩，产业"空心化" | 拉美、非洲、英美部分地区（英美属货币高估驱动型） |

**翟东升视角**：去工业化是**中央-外围体系运转的副产品**。对中央国家而言，货币霸权导致本币高估，制造业被迫外移（"荷兰病"）；对外围国家而言，过度开放资本账户和遵从华盛顿共识，导致本土工业被跨国资本掏空。**守住制造业基本盘**是翟东升反复强调的核心命题——人民币的真正"锚"不是黄金，而是中国的工业产能。

> 💡 **速记**：制造业占比持续下降 = 去工业化。分成熟型（正常）和病理型（危险）。翟东升：守住制造业 = 守住货币之锚。

---

#### 2. [名] 预算软约束
> *出现 1 次：卷8*


**一句话定义**：匈牙利经济学家科尔奈（Kornai）提出的概念，指<span class="hl">企业（尤其是国有企业）即使经营亏损，也能通过政府补贴、贷款减免、税收优惠等方式继续存活，不受"硬预算约束"的市场纪律制约</span>。

**核心要点**：
- **"软"**：企业不必因亏损而破产，边界可伸缩
- **"硬"**：企业必须量入为出，亏损就出局
- **根源**：政府出于就业、社会稳定等**政治考量**而持续"输血"
- **后果**：资源错配、效率低下、道德风险（"亏了有人兜底"）

**翟东升视角**：预算软约束不仅存在于转型经济体，在国际层面同样适用——**美国凭借美元霸权享有全球最大的"预算软约束"**，可以长期维持财政赤字和贸易逆差而不受严厉的市场惩罚，因为全球各国不得不持有美元资产为其融资。

> 💡 **速记**：亏了不死 = 预算软约束。科尔奈提出，原指国企；翟东升延伸：美国靠美元霸权享受全球最大"软约束"。

---

#### 3. [名] 经济安全
> *出现 1 次：卷8*


**一句话定义**：指<span class="hl">一国在经济领域抵御内外部威胁和冲击、维持经济体系稳定运行和可持续发展的能力与状态</span>。

**核心维度**：
1. **金融安全**：防范金融危机、资本外逃、汇率崩溃
2. **产业安全**：关键产业链不被外部"卡脖子"
3. **资源安全**：能源、粮食、关键矿产供应可靠
4. **数据安全**：经济数据和信息系统不被外部渗透

**翟东升视角**：经济安全的核心不是封闭自保，而是**在开放中掌握主动权**。当前最大的经济安全威胁来自美元体系的“武器化”——SWIFT制裁、冻结外汇储备、技术脱钩等手段表明，**过度依赖单一货币体系本身就是最大的不安全**。中国推进人民币国际化、建设CIPS、减持美债、增持黄金，本质都是**经济安全的战略布局**。

> 💡 **速记**：经济安全 = 不被卡脖子 + 不被收割。翟东升：最大不安全 = 过度依赖美元体系。

---

#### 4. [名] 国际货币基金组织（IMF）
> *出现 1 次：卷9*


**一句话定义**：1944年布雷顿森林会议上创立的国际金融机构，旨在<span class="hl">促进国际货币合作、维护汇率稳定、提供短期资金援助以帮助成员国解决国际收支困难</span>。

**核心功能**：

| 功能 | 说明 |
|------|------|
| **监督** | 对成员国经济政策进行定期审查和监测 |
| **融资** | 向国际收支困难的成员国提供短期贷款 |
| **技术援助** | 帮助成员国建设制度能力和政策框架 |

**翟东升视角**：IMF本质上是**美元霸权的制度性支柱**之一。其投票权按出资额分配，美国拥有事实上的一票否决权。IMF对发展中国家的"条件性贷款"（紧缩+私有化+开放）不是中性的技术救助，而是**华盛顿共识的执行工具**——迫使外围国打开市场，为下一轮"美元潮汐收割"拆除防火墙。

> 💡 **速记**：监督+融资+技术援助；美国一票否决权；翟东升：IMF是美元霸权制度支柱，条件性贷款 = 华盛顿共识执行器。

---

#### 5. [名] 出口导向型经济
> *出现 1 次：卷9*


**一句话定义**：<span class="hl">以出口贸易为主要增长动力的经济发展战略</span>，通过生产面向国际市场的产品来拉动GDP增长、创造就业和积累外汇。

**与进口替代战略的对比**：

| | 出口导向 | 进口替代 |
|---|---------|---------|
| 核心 | 融入全球分工，以出口促增长 | 保护国内市场，自主发展工业替代进口 |
| 典型 | 东亚"四小龙"、中国 | 拉美国家（50-70年代） |
| 优势 | 利用比较优势、获取技术溢出 | 保护弱势产业、减少外部依赖 |
| 风险 | 外部依赖大、汇率被低估剥夺内需 | 效率低下、缺乏竞争力 |

**翟东升视角**：中国改革开放后选择出口导向战略是**“三外路线”（鼓励外贸、吸引外资、控制外汇）**的核心组成部分。这一战略使中国完成了全球最大规模的工业化，但代价是人民币长期被低估，国民实际购买力被压制——**"用勤劳换美元纸资产"**。2012年后中国正从出口导向转向**内需驱动**的新发展模式。

> 💡 **速记**：以出口促增长，东亚模式代表。翟东升：三外路线的核心，成就工业化但代价是"勤劳换纸"，2012年后转向内需。

---

#### 6. [名] 滞胀
> *出现 1 次：卷10*


**一句话定义**：<span class="hl">经济停滞（高失业率）与高通货膨胀并存</span>的经济现象，即"停滞性通货膨胀"（Stagflation）。

**核心要点**：
- **典型案例**：1970年代西方国家（两次石油危机驱动）
- **成因**：供给冲击（如油价暴涨导致成本推高）+ 错误的政府政策
- **理论冲击**：传统凯恩斯主义认为通胀和失业不会同时出现（菲利普斯曲线），滞胀使之失效
- **政策两难**：紧缩治通胀加剧失业，扩张促就业加剧通胀

**翟东升视角**：1970年代的滞胀是凯恩斯主义政策失灵的标志，为新自由主义（里根/撒切尔）的上台提供了政治土壤。沃尔克通过极端加息治通胀，虽成功压制物价，但同时触发了拉美债务危机——**治愈中心国的“病”，代价由外围国承担**，体现了体系的不对称性。

> 💡 **速记**：停滞+通胀=滞胀。70年代石油危机经典案例。凯恩斯主义无能为力→新自由主义登场。翟东升：治中心国的病，外围国买单。

---

#### 7. [名] 华盛顿共识
> *出现 1 次：卷10*


**一句话定义**：1989年由美国经济学家威廉姆森总结的一套<span class="hl">以新自由主义为内核的经济政策药方</span>，被IMF和世界银行推广为发展中国家改革的"标准方案"。

**"十条药方"核心归纳**：

| 类别 | 内容 |
|------|------|
| **财政纪律** | 控制赤字、削减非生产性支出 |
| **经济自由化** | 贸易自由化、利率市场化、汇率市场化 |
| **私有化** | 国企私有化、放松管制 |
| **开放市场** | 取消外资限制、保护产权 |

**翟东升视角**：华盛顿共识**不是中性的经济学建议，而是美国推行新自由主义全球化的意识形态工具**。它要求发展中国家打开市场、放松管制、私有化国有资产，实质是为西方资本进入和收割铺路。拉美"失去的十年"、俄罗斯"休克疗法"的灾难都与盲目执行华盛顿共识直接相关。中国的发展奇迹恰恰在于**有选择地吸收而非照搬**——开放市场但保留资本管制，引入外资但国家掌握关键产业。

> 💡 **速记**："四化"药方（自由化、私有化、市场化、去管制化）。翟东升：不是经济学建议，是美国资本开路先锋。中国成功在于有选择地吸收而非照搬。

#### 8. [名] 加工贸易
> *出现 1 次：卷2* 


企业进口原材料、零部件，在国内加工、组装成成品后再出口的贸易方式，核心特征是<span class="hl">**“两头在外”**（原料进口、产品出口）</span>，主要形式包括来料加工和进料加工。加工贸易是改革开放后中国制造业快速发展的重要路径，鼎盛时期（2000 年代）占中国出口的约 55%。翟东升指出，加工贸易将中国嵌入全球价值链的**组装环节**，获得就业和外汇但附加值极低（“微笑曲线”底部）；它是“三外路线”的具体体现，也是中国低估汇率换取出口规模的制度载体。随着劳动力成本上升和产业升级，加工贸易占比已大幅下降，是产业升级的重要指标。

#### 9. [名] 资源诅咒（荷兰病）
> *出现 1 次：卷2* 


丰富的自然资源（石油、矿产）反而导致经济发展停滞的现象，又称“荷兰病”（Dutch Disease）。机制：<span class="hl">资源出口繁荣 → 本币升值 → 制造业出口竞争力下降 → 非资源产业萎缩 → 经济结构畸形 → 一旦资源价格下跌即陷入危机</span>。典型案例：中东石油国（高度依赖石油，制造业薄弱）；尼日利亚、委内瑞拉（资源丰富但发展停滞）。翟东升指出，资源诅咒深刻揭示了**货币汇率与产业结构的互动关系**——资源富集导致汇率高估，等同于向制造业征税；它是中心-外围理论的重要补充，也是“守住制造业才是真正的国力”的理论依据之一。

#### 10. [名] 友岸外包（Friend-shoring）
> *出现 1 次：卷4* 


美国拜登政府提出的供应链重组策略：<span class="hl">将生产和采购集中于政治上“可信任的盟友”（友好国家），避免对“潜在对手”（主要指中国）的过度依赖</span>。与“近岸外包”（Nearshoring，向地理近邻国家转移）形成“双轮策略”。友岸外包的**政治逻辑优先于经济逻辑**——即便生产成本更高，也要维护供应链安全。翟东升指出，友岸外包本质上是**将贸易政治化**的另一面，但面临三大内在矛盾：①“友岸”（越南、印度、墨西哥）仍大量依赖中国中间品；②生产成本大幅上升，损害美国消费者利益；③“友岸”国家未必甘愿选边站。

#### 11. [名] 资产泡沫
> *出现 1 次：卷6* 


资产价格（股票、房产、大宗商品等）<span class="hl">持续显著偏离其基本面价值（内在价值）的状态</span>，通常由信贷扩张、市场预期自我实现和流动性过剩共同推动。**泡沫形成三阶段**：①流动性宽松 → 资产价格上涨 → 财富效应 → 更多信贷投入；②价格脱离基本面但情绪持续驱动（“非理性繁荣”）；③触发因素（利率上升、信心逆转）→ 泡沫破裂 → 资产价格急跌 → 债务通缩螺旋。翟东升框架：美联储的宽松货币政策（低利率 + QE）是全球资产泡沫的主要驱动因素；“**美元潮汐**”收放导致全球资产价格周期性波动——资本输出时制造泡沫、回流时刺破泡沫。典型案例：1990 年日本、2000 年美国科技股、2007 年美国房市、2015 年 A 股。

#### 12. [名] 进口替代战略（ISI）
> *出现 1 次：卷6* 


Import Substitution Industrialization，<span class="hl">发展中国家以政府政策（关税保护、补贴、外汇管制）扶持本国工业替代进口商品的工业化战略</span>，流行于 1950-1970 年代拉丁美洲（阿根廷、巴西、墨西哥）和部分亚非国家。核心逻辑：①保护幼稚产业；②减少对外依赖、节约外汇；③推动工业化和就业。**主要问题**：①保护产业效率低下，难以形成出口竞争力；②外汇短缺（进口设备 + 能源仍需大量外汇，国内商品又打不进国际市场）；③财政赤字（补贴 + 国有企业亏损）→ 通货膨胀 → 债务危机（拉美 1982 年危机的结构性根源之一）。与东亚出口导向（EOI）战略形成鲜明对比：东亚选择融入全球分工，拉美选择内向保护，结果截然不同。翟东升指出，ISI 失败的核心是**脱离全球市场就脱离了技术进步和规模效益的压力**。

#### 13. [名] 康德拉季耶夫周期（长波周期）
> *出现 1 次：卷6* 


> 🔀 同一名词已在 [经济周期与理论模型 · 康德拉季耶夫周期](#经济周期与理论模型) 专题完整展开（含长波四阶段、技术驱动机制、翟东升对第六次康波的应用），此处不再重复。

#### 14. [名] 全球供应链
> *出现 1 次：卷3*


产品从原材料采购、零部件生产、最终组装到销售分布于多个国家的全球化生产网络，以<span class="hl">分工细化、比较优势最大化</span>为特征。形成背景：贸易自由化（WTO）+ 信息技术（互联网 + ERP 系统）+ 运输成本下降（集装箱化）。翟东升指出，全球供应链是新自由主义全球化的核心制度成果，中国通过三外路线深度嵌入其中，成为“世界工厂”。但 2020 年后新冠疫情和中美博弈使全球供应链的**脆弱性暴露无遗**——过度集中在单一国家（中国）导致的供应链中断，引发西方国家的“供应链安全化”焦虑，推动供应链重组（近岸化 / 友岸化）。翟东升认为：即便供应链在形式上重组，中国作为中间品生产者和关键技术节点的地位仍难以在短期内被取代。

#### 1. [简] 全球货币市场份额的分布体现了何种结构性规律？
> *出现 1 次：卷5*


##### **🎯 考场标准作答（直击采分点 · 可直接背诵）**

> **答：全球货币市场份额呈现"幂律分布"——少数货币主导、绝大多数边缘化，体现赢者通吃、路径锁定与等级化三大结构性规律。**
>
> **1. 现象（极度不均衡）**：美元占国际支付/储备/计价 50% 以上，欧元约 20-25%，英镑、日元各约 5%，人民币约 3%，其余近 200 种货币共享极小份额——符合幂律分布 y = C × x^(-α)。
> **2. 赢者通吃（马太效应）**：货币国际化具有强**网络外部性**与**规模报酬递增**，使用者越多越吸引新用户，领先货币优势自我强化。
> **3. 路径依赖与锁定**：霸权货币（英镑→美元）一旦确立主导，即使霸权国经济相对衰落，货币地位仍长期维持，因**转换成本巨大**。
> **4. 翟东升"货币份额幂律"**：国际货币体系天然等级化集中化，根源是**综合国力 + 金融市场深度 + 制度信誉**的复合作用；后发货币须提供**差异化公共产品**而非模仿美元，铸币税应由全球共享。

#### 2. [简] 简述国际货币含义的几个层次
> *出现 1 次：卷5*


##### **🎯 考场标准作答（直击采分点 · 可直接背诵）**

> **答：国际货币的含义分"私人三功能 + 官方三功能"两大维度、六个层次，呈由浅入深、由易到难的递进结构。**
>
> **一、私人使用三功能**
> **1. 计价货币（价值尺度）**：国际贸易和金融产品以该货币标价。
> **2. 结算货币（交换媒介）**：国际贸易和金融交易中实际支付使用。
> **3. 投资货币（价值储藏）**：个人和机构持有该货币计价的金融资产。
>
> **二、官方使用三功能**
> **4. 锚货币（价值尺度）**：其他国家将本币汇率与之挂钩。
> **5. 干预货币（交换媒介）**：央行在外汇市场干预时使用。
> **6. 储备货币（价值储藏）**：各国央行持有的外汇储备。
>
> **递进规律**：由浅入深（计价/结算→投资→储备）、由易到难（贸易计价最易、官方储备最难）、由量到权（份额越大→铸币税与金融权力越大）。最高层次是"锚货币 + 储备货币"，六维全占即霸权。

这是本题最易被追问的深化点。翟东升特别强调：六维功能里，**谁能用本币为国际债务定价，谁就掌握了金融体系的核心权力**。因为债务以本币定价意味着：

*   **通胀/贬值可稀释债务**：美元计价的债务，美国可通过让美元贬值实质减少偿还负担——这是向全球债权人征收的"通胀税"。
*   **他国承担汇率风险**：发展中国家借美元债，还债时若本币贬值，债务负担暴涨——拉美、亚洲金融危机的根源。
*   **制裁与切断的杠杆**：以美元定价的债务清算必须经过 SWIFT/CHIPS，美国可随时"断网"。

<script>
(function () {
  var md = document.getElementById('md-source').textContent;

  // 修复 marked v12 把 SVG 内部的空行+注释误判为段落边界，往 <svg> 里插入非法 <p>
  // 导致浏览器错误恢复、SVG 后半段（如"外因栏"）塌陷成纯文字。
  // 做法：解析前把所有 <svg>...</svg> 整块摘出存档、替换为占位符，解析后再原样还原。
  var svgStore = [];
  md = md.replace(/<svg[\s\S]*?<\/svg>/g, function (m) {
    var ph = '\u0000SVG' + svgStore.length + '\u0000';
    svgStore.push(m);
    return ph;
  });

  // 修复 marked v12 对 ** 紧贴 CJK 标点时无法识别加粗的问题
  md = md.replace(/\*\*([^\s*](?:[^*]*[^\s*])?)\*\*/g, '<strong>$1</strong>');

  // 修复「必背/重难点/补充」标签引用块紧贴视频列表末行（无空行）导致被解析进 li 的问题：
  // 统一在其前补一个空行，使其成为独立块级元素（内容不变，仅分段规范化）
  md = md.replace(/\n(>[ ]*\*(?:必背|重难点|补充))/g, '\n\n$1');

  // 修复「考场标准作答」等引用块内换行丢失的问题：
  // marked breaks:false 时，相邻引用行会被合并成一个段落，导致 1. 2. 3. 编号要点挤在一起。
  // 注意：此时 ** 已被上方规则转成 <strong>，故模式匹配 <strong>N. 而非 **N.；
  // 边界 \n 放在先行断言里不消耗，保证连续编号（1/2/3/4）每个边界都能命中。
  // 规则一：任何非空引用行之后若紧跟新的编号要点行（> <strong>N.），补一个空引用行使其各自成段。
  md = md.replace(/\n(>[ ]*\S[^\n]*)(?=\n>[ ]*<strong>\d)/g, '\n$1\n>');
  // 规则二：编号要点行之后若紧跟斜体小结行（> *……*），同样补空引用行分段
  // （排除 必背/重难点/补充 标签行，以及 > * 空格开头的列表项行）。
  md = md.replace(/\n(>[ ]*<strong>\d[^\n]*)(?=\n>[ ]*\*(?![ ]*(?:必背|重难点|补充))[^*\s])/g, '\n$1\n>');

  requestAnimationFrame(function () {
    var htmlOut = marked.parse(md);

    if (svgStore.length) {
      htmlOut = htmlOut.replace(/\u0000SVG(\d+)\u0000/g, function (_, i) {
        return svgStore[+i];
      });
    }
    document.getElementById('content').innerHTML = htmlOut;
    var h1El = document.querySelector('h1');
    if (h1El) document.title = h1El.textContent;

    // ===== 金本位自动调节时序图动画初始化（原逻辑保留） =====
    var GANIM_CURVES = [
      ['.c-gold',100,1200],['.c-money',1000,1200],['.c-price',1900,1200],['.c-fx',100,3000]
    ];
    var GANIM_LABELS = [['.l-gold',1300],['.l-money',2200],['.l-price',3100],['.l-fx',3100]];
    var GANIM_REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function ganimPlay(wrap){
      wrap.querySelectorAll('.gcurve').forEach(function(e){e.getAnimations().forEach(function(a){a.cancel();});});
      wrap.querySelectorAll('.glbl').forEach(function(e){e.getAnimations().forEach(function(a){a.cancel();});});
      if(GANIM_REDUCE){
        wrap.querySelectorAll('.gcurve').forEach(function(e){e.style.strokeDashoffset=0;});
        wrap.querySelectorAll('.glbl').forEach(function(e){e.style.opacity=1;});
        return;
      }
      GANIM_CURVES.forEach(function(c){
        var el=wrap.querySelector(c[0]);
        if(!el) return;

        el.animate([{strokeDashoffset:len},{strokeDashoffset:0}],

    window.ganimReplay=function(){
      var wrap=document.querySelector('.gold-anim');
      if(wrap) ganimPlay(wrap);

    document.querySelectorAll('.gold-anim').forEach(function(wrap){

          entries.forEach(function(en){ if(en.isIntersecting && !wrap._ganimPlayed){ wrap._ganimPlayed=true; ganimPlay(wrap); io.disconnect(); } });
        },{threshold:0.25});
        io.observe(wrap);
        setTimeout(function(){ if(!wrap._ganimPlayed){ wrap._ganimPlayed=true; ganimPlay(wrap); io.disconnect(); } },2000);
      } else { ganimPlay(wrap); }
    });
    // ===== 时序图动画初始化结束 =====

    var content = document.getElementById('content');

    // ===== 已掌握状态（localStorage 持久化） =====
    var DONE_KEY = 'mfipe-done-v1';
    var doneSet = {};
    try {
      var raw = localStorage.getItem(DONE_KEY);
      if (raw) JSON.parse(raw).forEach(function (i) { doneSet[i] = true; });
    } catch (e) {}
    function saveDone() {
      try {
        var arr = Object.keys(doneSet).map(function (k) { return parseInt(k, 10); });
        localStorage.setItem(DONE_KEY, JSON.stringify(arr));
      } catch (e) {}
    }

    // ===== 复习统计：每题「读 N 次」——展开且在视口累计停留 ≥ 阈值 = 1 次读完 =====
    // 仿播客页 podcast_stats_v1：{ [idx]: { reads, seconds } }
    var READS_KEY = 'mfipe-reads-v1';
    var READ_THRESHOLD = 8;        // 秒：单次展开累计可见停留达到此值算"读完 1 次"
    var FLUSH_SEC = 5;             // 秒：可见时长攒到此处落盘一次（仿播客 pendingSec≥10）
    var TICK_MS = 1000;            // 计时心跳
    var readStats = {};
    var readChips = {};            // idx → 角标 DOM
    var readTimers = {};           // idx → { acc, counted, pending, lastTs, tick }
    try {
      var rawReads = localStorage.getItem(READS_KEY);
      if (rawReads) readStats = JSON.parse(rawReads) || {};
    } catch (e) {}
    function getRead(idx) {
      var s = readStats[idx];
      return { reads: (s && s.reads) || 0, seconds: (s && s.seconds) || 0 };
    }
    function saveReads() {
      try { localStorage.setItem(READS_KEY, JSON.stringify(readStats)); } catch (e) {}
    }
    // 把 pending 秒数落盘到 seconds（仿播客 flushListened）
    function flushPending(idx) {
      var t = readTimers[idx];
      if (!t || t.pending < 1) return;
      var s = getRead(idx);
      s.seconds += t.pending;
      readStats[idx] = s;
      t.pending = 0;
      saveReads();
      updateReadChip(readChips[idx], s);
    }
    function fmtReadSec(sec) {
      sec = Math.max(0, Math.round(sec || 0));
      if (sec < 60) return sec + ' 秒';
      if (sec < 3600) return Math.round(sec / 60) + ' 分';
      return (sec / 3600).toFixed(1) + ' 时';
    }
    function updateReadChip(el, s) {
      if (!el) return;
      if (s.reads > 0) {
        el.classList.add('show');
        el.textContent = '📖 读 ' + s.reads + ' 次';
        el.title = '累计研读 ' + fmtReadSec(s.seconds);
      } else {
        el.classList.remove('show');
        el.textContent = '';
        el.title = '';
      }
    }
    // 题卡至少部分在视口内才算"可见"（防滚出屏幕仍空计时）
    function isCardVisible(item) {
      var r = item.getBoundingClientRect();
      var vh = window.innerHeight;
      return r.bottom > 80 && r.top < vh - 40;
    }
    function startReadTimer(idx, item) {
      if (readTimers[idx]) return;
      var t = { acc: 0, counted: false, pending: 0, lastTs: 0 };
      readTimers[idx] = t;
      t.tick = setInterval(function () {
        // tab 隐藏 / 题卡折叠 / 滚出视口 → 暂停累计（先 flush 已攒的，再重置基准）
        if (document.hidden) { flushPending(idx); t.lastTs = 0; return; }
        if (!item.classList.contains('expanded')) { flushPending(idx); t.lastTs = 0; return; }
        if (!isCardVisible(item)) { flushPending(idx); t.lastTs = 0; return; }
        var now = Date.now();
        if (t.lastTs) {
          var delta = (now - t.lastTs) / 1000;
          // 仿播客：只接受 0~3s 的合理增量，防止 tab 切换造成的大跳
          if (delta > 0 && delta < 3) {
            t.acc += delta;
            t.pending += delta;
          }
        }
        t.lastTs = now;
        if (t.pending >= FLUSH_SEC) flushPending(idx);
        if (!t.counted && t.acc >= READ_THRESHOLD) {
          t.counted = true;
          var s = getRead(idx);
          s.reads += 1;
          readStats[idx] = s;
          saveReads();
          updateReadChip(readChips[idx], s);
        }
      }, TICK_MS);
    }
    function stopReadTimer(idx) {
      var t = readTimers[idx];
      if (!t) return;
      clearInterval(t.tick);
      flushPending(idx);  // 折叠/隐藏前把攒下的零碎秒数落盘
      delete readTimers[idx];
    }
    // 统一入口：所有改 expanded 的地方都走这里，保证计时器与显示态不漂移
    function setQuestionExpanded(item, on) {
      var idx = parseInt(item.dataset.idx, 10);
      var wasExpanded = item.classList.contains('expanded');
      if (on && !wasExpanded) {
        item.classList.add('expanded');
        if (idx) startReadTimer(idx, item);
      } else if (!on && wasExpanded) {
        item.classList.remove('expanded');
        if (idx) stopReadTimer(idx);
      }
    }
    // 离场前把所有展开中的计时器落盘（仿播客 pagehide）
    function flushReadTimers() {
      Object.keys(readTimers).forEach(function (k) { stopReadTimer(parseInt(k, 10)); });
    }

    // ===== 把每道 #### 题目包成可折叠卡片（含题型徽章 + 已掌握勾选） =====
    // 扫描题卡正文，提取频率信息：
    // ① 常规「> *出现 N 次：卷…*」→ { n, src }
    // ② 组名词题「→卷X（各 N 次）」→ 取各词最少次数，src 标注「组题」
    function scanFreq(h4) {
      var node = h4.nextElementSibling;
      var hops = 0;
      // 只在该题范围内找（遇到下一道题/下一节标题即停），最多看 6 个块级元素
      while (node && hops < 6 && ['H2','H3','H4'].indexOf(node.tagName) === -1) {
        var txt = node.textContent || '';
        var m = txt.match(/出现\s*(\d+)\s*次\s*[：:]\s*([^*\n]*)/);
        if (m && parseInt(m[1], 10) > 0) {
          var src = (m[2] || '').trim();
          if (!src) src = '见正文';
          return { n: parseInt(m[1], 10), src: src };
        }
        // 组名词题兜底：「各 N 次」逐词统计
        var gm = txt.match(/各\s*(\d+)\s*次/);
        if (gm) {
          return { n: parseInt(gm[1], 10), src: txt.replace(/[*\n]/g, '').trim().slice(0, 60) };
        }
        node = node.nextElementSibling;
        hops++;
      }
      return null;
    }

    var h4s = content.querySelectorAll('h4');
    var qi = 0;
    var TYPE_MAP = { '名': ['名', 'ming'], '简': ['简', 'jian'], '论': ['论', 'lun'] };

    h4s.forEach(function (h4) {
      qi++;
      var h4Id = h4.id || '';
      var rawText = h4.textContent;

      var item = document.createElement('div');
      item.className = 'question-item';
      item.dataset.idx = qi;
      if (h4Id) item.id = h4Id;

      var header = document.createElement('div');
      header.className = 'question-header';

      var num = document.createElement('span');
      num.className = 'question-num';
      num.textContent = qi;
      header.appendChild(num);

      // 题型徽章：从「N. [名] 题干」中提取
      var cleanTitle = rawText.replace(/^\s*\d+\s*[.、．]\s*/, '');
      var tm = cleanTitle.match(/^\[(名|简|论)\]\s*/);
      if (tm) {
        var t = TYPE_MAP[tm[1]];
        var chip = document.createElement('span');
        chip.className = 'q-type ' + t[1];
        chip.textContent = t[0];
        header.appendChild(chip);
        cleanTitle = cleanTitle.slice(tm[0].length);
      }

      // 出现频率徽章：扫描题卡正文首个「出现 N 次：卷…」引用块，提取次数 + 卷号出处
      var freqInfo = scanFreq(h4);
      if (freqInfo) {
        var fchip = document.createElement('span');
        fchip.className = 'q-freq ' + (freqInfo.n >= 3 ? 'hi' : freqInfo.n === 2 ? 'mid' : 'lo');
        fchip.textContent = '出现 ' + freqInfo.n + ' 次';
        fchip.title = '10套模拟卷出现 ' + freqInfo.n + ' 次：' + freqInfo.src;
        header.appendChild(fchip);
      }
      var title = document.createElement('span');
      title.className = 'question-title';
      title.textContent = cleanTitle;
      header.appendChild(title);

      // 已掌握勾选
      var doneBtn = document.createElement('button');
      doneBtn.className = 'q-done';
      doneBtn.title = '标记为已掌握';
      doneBtn.textContent = '✓';

      // 复习次数角标（仿播客页 play-stat：有数据才显示）
      var readsChip = document.createElement('span');
      readsChip.className = 'q-reads';
      header.appendChild(readsChip);
      (function (idx, el) {
        readChips[idx] = el;
        var s = getRead(idx);
        updateReadChip(el, s);
      })(qi, readsChip);

      (function (idx, btn, it) {
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          toggleDone(idx);
        });
      })(qi, doneBtn, item);
      header.appendChild(doneBtn);

      var arrow = document.createElement('span');
      arrow.className = 'question-arrow';
      arrow.textContent = '▶';
      header.appendChild(arrow);

      var body = document.createElement('div');
      body.className = 'question-body';
      var qb = document.createElement('div');
      qb.className = 'qb';
      var qbIn = document.createElement('div');
      qbIn.className = 'qb-in';
      qb.appendChild(qbIn);
      body.appendChild(qb);

      var sib = h4.nextElementSibling;
      while (sib && sib.tagName !== 'H2' && sib.tagName !== 'H3' && sib.tagName !== 'H4') {
        var next = sib.nextElementSibling;
        qbIn.appendChild(sib);
        sib = next;
      }

      item.appendChild(header);
      item.appendChild(body);
      h4.parentNode.replaceChild(item, h4);

      header.addEventListener('click', function () {
        setQuestionExpanded(item, !item.classList.contains('expanded'));
      });
    });

    // 离开页面前把展开中的计时器落盘（仿播客 pagehide，绑一次即可）
    window.addEventListener('pagehide', flushReadTimers);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) flushReadTimers();
    });

    var questions = Array.prototype.slice.call(document.querySelectorAll('.question-item'));

    function toggleDone(idx) {
      if (doneSet[idx]) delete doneSet[idx]; else doneSet[idx] = true;
      saveDone();
      questions.forEach(function (q) {
        if (parseInt(q.dataset.idx, 10) === idx) q.classList.toggle('done', !!doneSet[idx]);
      });
      updateDoneUI();
      applyFilters();
    }
    function updateDoneUI() {
      var n = Object.keys(doneSet).length;
      document.getElementById('doneProgress').textContent = '✓ 已掌握 ' + n + ' / ' + questions.length;
      questions.forEach(function (q) {
        q.classList.toggle('done', !!doneSet[parseInt(q.dataset.idx, 10)]);
      });
    }

    // ===== 速记卡片（interlude，原逻辑保留） =====
    // ===== 「考场标准作答 / 深度复习笔记」小节标记（差异化样式） =====
    content.querySelectorAll('h5').forEach(function (h5) {
      var t = h5.textContent;
      if (t.indexOf('考场标准作答') !== -1) {
        h5.classList.add('ans-head');
        var bq = h5.nextElementSibling;
        if (bq && bq.tagName === 'BLOCKQUOTE') bq.classList.add('ans-block');
      } else if (t.indexOf('深度复习笔记') !== -1) {
        h5.classList.add('notes-head');
      }
    });

    content.querySelectorAll('h3').forEach(function (h3) {
      var txt = h3.textContent;
      var isVideo = txt.indexOf('📺') !== -1 || txt.indexOf('B站') !== -1;
      var isChapterTitle = h3.querySelector('a[id^="补遗"]') || /^补遗/.test(txt.trim());
      if (isVideo || isChapterTitle) return;
      var prev = h3.previousElementSibling;
      var next = h3.nextElementSibling;
      var prevIsCard = prev && prev.classList && prev.classList.contains('question-item');
      var hasNextCard = false;
      var n = next;
      while (n) { if (n.classList && n.classList.contains('question-item')) { hasNextCard = true; break; } n = n.nextElementSibling; }
      if (prevIsCard && hasNextCard) {
        var box = document.createElement('div');
        box.className = 'interlude';
        var tag = document.createElement('div');
        tag.className = 'interlude-tag';
        tag.textContent = '📌 ' + h3.textContent.trim();
        box.appendChild(tag);
        var sib = h3.nextElementSibling;
        var inner = document.createElement('div');
        inner.className = 'interlude-body';
        while (sib && !(sib.classList && sib.classList.contains('question-item')) && sib.tagName !== 'H2' && sib.tagName !== 'H3') {
          var nx = sib.nextElementSibling;
          inner.appendChild(sib);
          sib = nx;
        }
        box.appendChild(inner);
        h3.parentNode.replaceChild(box, h3);
      }
    });
    var interludes = document.querySelectorAll('.interlude');

    // ===== B站视频块卡片化 =====
    content.querySelectorAll('h3').forEach(function (h3) {
      if (h3.textContent.indexOf('📺') === -1) return;
      var card = document.createElement('div');
      card.className = 'video-card';
      h3.parentNode.insertBefore(card, h3);
      card.appendChild(h3);
      var sib = card.nextElementSibling;
      while (sib && sib.tagName !== 'H2' && sib.tagName !== 'H3' && sib.tagName !== 'H4'
             && !(sib.classList && (sib.classList.contains('question-item') || sib.classList.contains('interlude')))
             && sib.tagName !== 'BLOCKQUOTE') {
        var nx = sib.nextElementSibling;
        card.appendChild(sib);
        sib = nx;
      }
    });

    // ===== 「必背 · X题」引用块 → 章节 meta chips =====
    var TAG_CLASS = { '必背': 'bibei', '重难点': 'zhongnan', '补充': 'buchong' };
    content.querySelectorAll('blockquote').forEach(function (bq) {
      var t = bq.textContent.trim();
      var m = t.match(/^(必背|重难点|补充)(?:\s*·\s*(.+))?$/);
      if (!m) return;
      var box = document.createElement('div');
      box.className = 'ch-meta';
      var tag = document.createElement('span');
      tag.className = 'ch-tag ' + (TAG_CLASS[m[1]] || 'default');
      tag.textContent = m[1];
      box.appendChild(tag);
      if (m[2]) {
        var cnt = document.createElement('span');
        cnt.className = 'ch-cnt';
        cnt.textContent = m[2];
        box.appendChild(cnt);
      }
      bq.parentNode.replaceChild(box, bq);
    });

    // ===== 章节 h2 增强 + 生成目录 =====
    var h2s = Array.prototype.slice.call(content.querySelectorAll('h2'));
    var tocData = [];
    var topicNo = 0;
    h2s.forEach(function (h2, i) {
      var anchorA = h2.querySelector('a[id]');
      var hid = anchorA ? anchorA.id : ('sec-' + i);
      h2.id = hid;

      var rawName = h2.textContent.trim();
      var cleanName = rawName.replace(/^[^一-龥a-zA-Z0-9(（]+/, '').trim();
      var isGuide = i === 0 || cleanName.indexOf('理论框架') !== -1;
      var isExtra = cleanName.indexOf('补遗') !== -1;

      // 统计本章题数
      var qCount = 0;
      var node = h2.nextElementSibling;
      while (node && node.tagName !== 'H2') {
        if (node.classList && node.classList.contains('question-item')) qCount++;
        node = node.nextElementSibling;
      }

      var tagLabel, tagClass, tocIdx;
      if (isGuide) { tagLabel = '导读'; tagClass = 'guide'; tocIdx = '导'; }
      else if (isExtra) { tagLabel = '补遗'; tagClass = 'extra'; tocIdx = '遗'; }
      else { topicNo++; tagLabel = '专题 ' + topicNo; tagClass = ''; tocIdx = (topicNo < 10 ? '0' : '') + topicNo; }

      var tag = document.createElement('span');
      tag.className = 'h2-tag ' + tagClass;
      tag.textContent = tagLabel;
      h2.insertBefore(tag, h2.firstChild);

      if (qCount > 0) {
        var cnt = document.createElement('span');
        cnt.className = 'h2-cnt';
        cnt.textContent = qCount + ' 题';
        h2.appendChild(cnt);
      }

      var anchor = document.createElement('a');
      anchor.className = 'h2-anchor';
      anchor.href = '#' + hid;
      anchor.title = '复制本章节链接';
      anchor.textContent = '#';
      h2.appendChild(anchor);

      tocData.push({ id: hid, idx: tocIdx, name: cleanName, count: qCount });
    });

    // 渲染目录（桌面侧栏 + 移动抽屉共用）
    function buildToc(navEl) {
      tocData.forEach(function (c) {
        var a = document.createElement('a');
        a.className = 'toc-link';
        a.href = '#' + c.id;
        a.dataset.target = c.id;
        var idx = document.createElement('span');
        idx.className = 'toc-idx';
        idx.textContent = c.idx;
        var name = document.createElement('span');
        name.className = 'toc-name';
        name.textContent = c.name;
        a.appendChild(idx);
        a.appendChild(name);
        if (c.count > 0) {
          var cnt = document.createElement('span');
          cnt.className = 'toc-cnt';
          cnt.textContent = c.count;
          a.appendChild(cnt);
        }
        navEl.appendChild(a);
      });
    }
    buildToc(document.getElementById('tocNav'));
    buildToc(document.getElementById('tocNavDrawer'));

    // 目录点击：平滑滚动 + 关闭抽屉
    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('.toc-link');
      if (!link) return;
      e.preventDefault();
      var target = document.getElementById(link.dataset.target);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      closeDrawer();
      history.replaceState(null, '', '#' + link.dataset.target);
    });

    // 滚动高亮当前章
    function setActiveToc(id) {
      document.querySelectorAll('.toc-link').forEach(function (l) {
        l.classList.toggle('active', l.dataset.target === id);
      });
    }
    if ('IntersectionObserver' in window) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) setActiveToc(en.target.id);
        });
      }, { rootMargin: '-90px 0px -72% 0px', threshold: 0 });
      h2s.forEach(function (h) { spy.observe(h); });
    }

    // ===== h1 后插入页面统计 chips =====
    if (h1El) {
      var meta = document.createElement('div');
      meta.className = 'page-meta';
      var chips = [
        ['📚 专题 ', String(topicNo)],
        ['📝 题目 ', String(questions.length)],
        ['🔥 跨卷复现考点 ', '15'],
        ['🕐 更新 ', '2026-07-16']
      ];
      chips.forEach(function (c) {
        var s = document.createElement('span');
        s.className = 'pm-chip';
        s.appendChild(document.createTextNode(c[0]));
        var b = document.createElement('b');
        b.textContent = c[1];
        s.appendChild(b);
        meta.appendChild(s);
      });
      h1El.parentNode.insertBefore(meta, h1El.nextSibling);
    }

    // ===== 第一个 h2 之前的引用块标记为导览 note =====
    (function () {
      var children = content.children;
      for (var i = 0; i < children.length; i++) {
        var el = children[i];
        if (el.tagName === 'H2') break;
        if (el.tagName === 'BLOCKQUOTE') el.classList.add('intro-note');
      }
    })();

    // ===== 表格横向滚动包裹 =====
    content.querySelectorAll('table').forEach(function (tb) {
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      tb.parentNode.insertBefore(wrap, tb);
      wrap.appendChild(tb);
    });

    // ===== 搜索 + 未掌握过滤 =====
    var interludesArr = Array.prototype.slice.call(interludes);
    var focusIdx = -1;
    var bodyCache = questions.map(function (q) {
      return q.querySelector('.question-body').textContent.toLowerCase();
    });
    var interludeCache = interludesArr.map(function (el) { return el.textContent.toLowerCase(); });

    var searchInput = document.getElementById('searchInput');
    var searchCount = document.getElementById('searchCount');
    var searchClear = document.getElementById('searchClear');
    var btnUndone = document.getElementById('btnUndone');
    var hideDone = false;
    var debounceTimer;

    function setFocus(idx) {
      questions.forEach(function (q) { q.classList.remove('focused'); });
      if (idx < 0 || idx >= questions.length) return;
      focusIdx = idx;
      questions[idx].classList.add('focused');
      questions[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function clearFocus() {
      questions.forEach(function (q) { q.classList.remove('focused'); });
      focusIdx = -1;
    }

    function applyFilters() {
      var query = searchInput.value.trim().toLowerCase();
      searchClear.classList.toggle('show', !!query);
      var matched = 0;
      questions.forEach(function (q, i) {
        var titleEl = q.querySelector('.question-title');
        var origTitle = titleEl.dataset.orig || titleEl.textContent;
        if (!titleEl.dataset.orig) titleEl.dataset.orig = titleEl.textContent;

        var visible = true;
        if (query) {
          var titleMatch = origTitle.toLowerCase().indexOf(query) !== -1;
          var bodyMatch = bodyCache[i].indexOf(query) !== -1;
          visible = titleMatch || bodyMatch;
          if (visible && titleMatch) {
            var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            titleEl.innerHTML = origTitle.replace(re, '<mark>$1</mark>');
          } else {
            titleEl.innerHTML = origTitle;
          }
          if (!visible) setQuestionExpanded(q, false);
        } else {
          titleEl.innerHTML = origTitle;
        }
        if (visible && hideDone && q.classList.contains('done')) visible = false;
        q.style.display = visible ? '' : 'none';
        if (visible) matched++;
      });
      var ilMatched = 0;
      interludesArr.forEach(function (el, k) {
        var hit = !query || interludeCache[k].indexOf(query) !== -1;
        el.style.display = hit ? '' : 'none';
        if (query && hit) ilMatched++;
      });
      // 搜索时隐藏无任何命中的章节标题及其视频卡/标签行
      h2s.forEach(function (h2) {
        var hasVisible = false;
        var chrome = [];
        var node = h2.nextElementSibling;
        while (node && node.tagName !== 'H2') {
          if (node.classList) {
            if (node.classList.contains('question-item') || node.classList.contains('interlude')) {
              if (node.style.display !== 'none') hasVisible = true;
            } else if (node.classList.contains('video-card') || node.classList.contains('ch-meta')) {
              chrome.push(node);
            }
          }
          node = node.nextElementSibling;
        }
        var show = !query || hasVisible;
        h2.style.display = show ? '' : 'none';
        chrome.forEach(function (el) { el.style.display = show ? '' : 'none'; });
      });
      searchCount.textContent = query ? (matched + ilMatched) + ' / ' + questions.length + ' 题' : '';
    }

    searchInput.addEventListener('input', function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyFilters, 150);
    });
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var first = questions.filter(function (q) { return q.style.display !== 'none'; })[0];
        if (first) {
          setQuestionExpanded(first, true);
          var idx = questions.indexOf(first);
          setFocus(idx);
        }
      }
    });
    searchClear.addEventListener('click', function () {
      searchInput.value = '';
      applyFilters();
      searchInput.focus();
    });

    btnUndone.addEventListener('click', function () {
      hideDone = !hideDone;
      btnUndone.classList.toggle('on', hideDone);
      applyFilters();
    });

    document.getElementById('btnExpandAll').addEventListener('click', function () {
      questions.forEach(function (q) { if (q.style.display !== 'none') setQuestionExpanded(q, true); });
    });
    document.getElementById('btnCollapseAll').addEventListener('click', function () {
      questions.forEach(function (q) { setQuestionExpanded(q, false); });
    });

    // ===== 深色模式切换 =====
    var btnTheme = document.getElementById('btnTheme');
    function syncThemeIcon() {
      btnTheme.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }
    btnTheme.addEventListener('click', function () {
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('mfipe-theme', dark ? 'dark' : 'light'); } catch (e) {}
      syncThemeIcon();
    });
    syncThemeIcon();

    // ===== 滚动：进度条 / 回到顶部 =====
    var backToTop = document.getElementById('backToTop');
    var progressBar = document.getElementById('progressBar');
    window.addEventListener('scroll', function () {
      var y = window.scrollY;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      progressBar.style.width = (max > 0 ? Math.min(100, (y / max) * 100) : 0) + '%';
      backToTop.classList.toggle('visible', y > 500);
    }, { passive: true });
    backToTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===== 移动端目录抽屉 =====
    var drawer = document.getElementById('tocDrawer');
    var overlay = document.getElementById('drawerOverlay');
    function openDrawer() { drawer.classList.add('open'); overlay.classList.add('open'); }
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
    document.getElementById('btnToc').addEventListener('click', openDrawer);
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    // ===== 快捷键提示：6 秒后自动隐藏，⌨ 按钮切换 =====
    var kbdHint = document.getElementById('kbdHint');
    var hintTimer;
    function showHint(auto) {
      kbdHint.classList.add('visible');
      clearTimeout(hintTimer);
      if (auto) hintTimer = setTimeout(function () { kbdHint.classList.remove('visible'); }, 6000);
    }
    document.getElementById('btnKbd').addEventListener('click', function () {
      if (kbdHint.classList.contains('visible')) { kbdHint.classList.remove('visible'); clearTimeout(hintTimer); }
      else showHint(false);
    });
    showHint(true);

    // ===== 键盘导航 =====
    document.addEventListener('keydown', function (e) {
      if (document.activeElement === searchInput) {
        if (e.key === 'Escape') { searchInput.blur(); searchInput.value = ''; applyFilters(); clearFocus(); }
        return;
      }
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === '/') { e.preventDefault(); searchInput.focus(); return; }
      if (e.key === 'j' || e.key === 'J') { setFocus(Math.min(focusIdx + 1, questions.length - 1)); return; }
      if (e.key === 'k' || e.key === 'K') { setFocus(Math.max(focusIdx - 1, 0)); return; }
      if (e.key === 'Enter' && focusIdx >= 0) {
        var it = questions[focusIdx];
        setQuestionExpanded(it, !it.classList.contains('expanded'));
        return;
      }
      if ((e.key === 'd' || e.key === 'D') && focusIdx >= 0) { toggleDone(parseInt(questions[focusIdx].dataset.idx, 10)); return; }
      if (e.key === 'Escape') { clearFocus(); closeDrawer(); return; }
      if (e.key === 'e' || e.key === 'E') {
        var allExp = questions.every(function (q) { return q.classList.contains('expanded'); });
        questions.forEach(function (q) { setQuestionExpanded(q, !allExp); });
      }
    });

    // 初始化已掌握 UI
    updateDoneUI();
    applyFilters();
  });
})();
</script>
