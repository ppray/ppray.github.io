<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帝国的账本：核心与边缘 | IPE 模拟游戏</title>
    <meta name="description" content="致敬 Victoria 3 机制与国际政治经济学经典理论的简化版网页策略模拟游戏。">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="stage">
    <div id="map-container"></div>
    <div class="vignette"></div>

    <!-- 顶部 HUD：国徽 + 资源仪表 + 年份牌 -->
    <header class="hud-top">
        <div class="crest">
            <div class="flag" id="crest-flag">🇬</div>
            <div>
                <div class="name" id="crest-name">大英帝国</div>
                <div class="rank" id="crest-rank">霸权国 · CORE HEGEMON</div>
            </div>
        </div>
        <div class="resources" id="resources"></div>
        <div class="modifiers" id="hud-modifiers" aria-label="进行中的跨回合效应"></div>
        <div class="date-plate">
            <div class="year" id="hud-year">1836</div>
            <div class="turn" id="hud-turn">TURN 01</div>
        </div>
    </header>

    <!-- 左侧功能竖排 -->
    <nav class="rail" id="rail"></nav>

    <!-- 国家切换坞 -->
    <div class="nations" id="nations"></div>

    <!-- 浮动面板 -->
    <section class="panel frame" id="panel" hidden>
        <div class="panel-head">
            <div>
                <h2 id="panel-title">关税与政治</h2>
                <div class="sub" id="panel-sub"></div>
            </div>
            <button class="x" id="panel-close" title="关闭面板">✕</button>
        </div>
        <div class="panel-body" id="panel-body"></div>
    </section>

    <!-- 事件日志流 -->
    <div class="log" id="log"></div>

    <!-- 回合控制坞 -->
    <div class="turn-dock">
        <div class="info">
            <div class="k">下一次结算</div>
            <div class="v" id="turn-hint">全球市场撮合</div>
        </div>
        <button id="btn-turn">下一回合</button>
        <button id="btn-help" title="玩法说明与胜负条件">？</button>
        <button id="btn-new" title="重新开始一局">新局</button>
    </div>
</div>

<script type="module">
    import { initUI } from './js/ui.js';
    window.addEventListener('DOMContentLoaded', initUI);
</script>
</body>
</html>
